<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مصاريفي</title>
<meta name="theme-color" content="#e8f2ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="مصاريفي">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;600;700&display=swap">
<style>
/* Layout: one-column phone app on a liquid-glass field — tabs (month / analysis / history), frosted cards, bottom sheets */
:root{
  --bg:#e8f2ff; --blob1:#a9d4ff; --blob2:#6fb3ff; --blob3:#ffffff;
  --surface:rgba(255,255,255,.55); --surface-2:rgba(255,255,255,.72); --field:rgba(255,255,255,.7);
  --glass-border:rgba(255,255,255,.85); --glass-shadow:0 8px 30px rgba(28,84,170,.12); --hl:rgba(255,255,255,.95);
  --ink:#0c2142; --muted:#4f6588; --line:rgba(12,33,66,.12);
  --accent:#1f6fe0; --accent-ink:#ffffff; --accent-soft:rgba(31,111,224,.13);
  --paid:#1a8a5c; --soon:#b7791f; --soon-soft:rgba(224,160,40,.16); --late:#c2362c; --late-soft:rgba(220,60,50,.13);
  --k1:#1f6fe0; --k2:#7a4fd0; --k3:#d08a24; --k4:#d24f78; --k5:#16a3b8; --k6:#4f8a2a; --k7:#8a7360; --k8:#4a57d6; --k9:#7f90a8;
  --display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#06132b; --blob1:#0d3f86; --blob2:#0a64b8; --blob3:#1a2c55;
  --surface:rgba(255,255,255,.07); --surface-2:rgba(255,255,255,.11); --field:rgba(255,255,255,.08);
  --glass-border:rgba(255,255,255,.16); --glass-shadow:0 8px 30px rgba(0,0,0,.35); --hl:rgba(255,255,255,.18);
  --ink:#eaf3ff; --muted:#9fb6d8; --line:rgba(255,255,255,.12);
  --accent:#6cb6ff; --accent-ink:#04122a; --accent-soft:rgba(108,182,255,.16);
  --paid:#5fd49a; --soon:#f0b555; --soon-soft:rgba(240,181,85,.16); --late:#ff8a80; --late-soft:rgba(255,120,110,.16);
  --k1:#6cb6ff; --k2:#b495ff; --k3:#f0b555; --k4:#ff8fb0; --k5:#4fd8ea; --k6:#9ad46a; --k7:#c7ae98; --k8:#93a0ff; --k9:#a9b8cf; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#06132b; --blob1:#0d3f86; --blob2:#0a64b8; --blob3:#1a2c55;
  --surface:rgba(255,255,255,.07); --surface-2:rgba(255,255,255,.11); --field:rgba(255,255,255,.08);
  --glass-border:rgba(255,255,255,.16); --glass-shadow:0 8px 30px rgba(0,0,0,.35); --hl:rgba(255,255,255,.18);
  --ink:#eaf3ff; --muted:#9fb6d8; --line:rgba(255,255,255,.12);
  --accent:#6cb6ff; --accent-ink:#04122a; --accent-soft:rgba(108,182,255,.16);
  --paid:#5fd49a; --soon:#f0b555; --soon-soft:rgba(240,181,85,.16); --late:#ff8a80; --late-soft:rgba(255,120,110,.16);
  --k1:#6cb6ff; --k2:#b495ff; --k3:#f0b555; --k4:#ff8fb0; --k5:#4fd8ea; --k6:#9ad46a; --k7:#c7ae98; --k8:#93a0ff; --k9:#a9b8cf; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 110px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tabs{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.tabs button{border:none;background:none;padding:7px 16px;border-radius:9px;font-weight:600;font-size:.9rem;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.icon-btn{width:40px;height:40px;flex:none;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:1.1rem}
.icon-btn svg{width:20px;height:20px}

/* month bar */
.month{display:flex;align-items:center;justify-content:space-between;gap:8px}
.month h1{margin:0;font-family:var(--display);font-size:1.25rem;font-weight:600;text-align:center}
.month small{display:block;color:var(--muted);font-size:.78rem;font-family:var(--body);font-weight:400}

/* summary */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px}
.salary-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.label{font-size:.78rem;color:var(--muted);letter-spacing:.02em}
.salary-btn{background:none;border:none;padding:0;text-align:start;display:flex;flex-direction:column}
.salary-btn .v{font-family:var(--display);font-size:1rem;font-weight:500}
.salary-btn .edit{font-size:.75rem;color:var(--accent)}
.big{display:flex;flex-direction:column}
.big .v{font-family:var(--display);font-size:2.1rem;font-weight:700;line-height:1.15}
.neg{color:var(--late)!important}
.cur{font-size:.85rem;font-weight:500;color:var(--muted);margin-inline-start:4px}
.meter{height:12px;border-radius:99px;background:var(--accent-soft);overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.meter .paid{background:var(--paid)}
.meter .due{background:var(--soon);opacity:.55}
.legend{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.legend div{display:flex;flex-direction:column;min-width:0}
.legend .v{font-weight:600;font-size:.98rem}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:5px;vertical-align:middle;flex:none}

/* category breakdown */
.cats-head{display:flex;justify-content:space-between;align-items:baseline}
.cats-head h2,.list-head h2,.sec-title{margin:0;font-family:var(--display);font-size:1.02rem;font-weight:600}
.stack{height:10px;border-radius:99px;overflow:hidden;display:flex;background:var(--line)}
.stack i{display:block;height:100%}
.catrows{display:flex;flex-direction:column;gap:8px}
.catrow{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:.9rem}
.catrow .nm{min-width:0;overflow-wrap:anywhere}
.catrow .sub{font-size:.75rem;color:var(--muted)}
.catrow .amt2{font-weight:600;text-align:end}

/* filters */
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:.82rem;display:flex;align-items:center;gap:4px}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* list */
.list-head{display:flex;align-items:baseline;justify-content:space-between}
.list-head span{color:var(--muted);font-size:.85rem}
.list{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;border-inline-start-width:4px}
.item.is-paid{opacity:.62}
.item.is-paid .name{text-decoration:line-through;text-decoration-color:var(--muted)}
.check{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;transition:background .15s,border-color .15s}
.check svg{width:16px;height:16px;opacity:0}
.is-paid .check{background:var(--paid);border-color:var(--paid)}
.is-paid .check svg{opacity:1}
.body{flex:1;min-width:0;background:none;border:none;padding:0;text-align:start;display:flex;flex-direction:column;gap:2px}
.name{font-weight:600;overflow-wrap:anywhere}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.78rem;color:var(--muted)}
.chip{font-size:.72rem;padding:1px 8px;border-radius:99px;font-weight:500}
.chip.late{background:var(--late-soft);color:var(--late)}
.chip.soon{background:var(--soon-soft);color:var(--soon)}
.chip.ok{background:var(--accent-soft);color:var(--accent)}
.amt{flex:none;font-family:var(--display);font-weight:600;font-size:1rem;text-align:end}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:22px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.empty p{margin:0}
.btn{border:none;border-radius:12px;padding:11px 16px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:var(--late-soft);color:var(--late)}
.btn.block{width:100%}
.note{font-size:.78rem;color:var(--muted);text-align:center;margin:0}
.status{font-size:.75rem;color:var(--muted);text-align:center;min-height:1em;margin:0}

/* history */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;min-width:0}
.kpi .v{font-family:var(--display);font-weight:600;font-size:1.15rem}
.hist{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.hrow{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;text-align:start}
.hrow .t{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.hrow .mn{font-family:var(--display);font-weight:600}
.hrow .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:.82rem}
.hrow .grid div{display:flex;flex-direction:column;min-width:0}
.hrow .grid b{font-weight:600}
.trend{width:100%;height:auto;display:block}

.fab{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));right:max(16px,env(safe-area-inset-right,0px));
  background:var(--accent);color:var(--accent-ink);border:none;border-radius:16px;padding:14px 20px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.18);display:flex;gap:8px;align-items:center;z-index:5}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:20px 20px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-height:90vh;overflow:auto}
.sheet form,.sheet .inner{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.sheet h3{margin:0;font-family:var(--display);font-size:1.1rem}
.field{display:flex;flex-direction:column;gap:5px;border:none;margin:0;padding:0;min-width:0}
.field label,.field legend{font-size:.82rem;color:var(--muted);padding:0;margin-bottom:5px}
.field input[type=text],.field input[type=number]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.catpick{display:flex;flex-wrap:wrap;gap:6px}
.catpick label{display:flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:99px;padding:6px 11px;font-size:.85rem;color:var(--ink);cursor:pointer;margin:0}
.catpick input{position:absolute;opacity:0;pointer-events:none}
.catpick label:has(input:checked){background:var(--ink);color:var(--bg);border-color:var(--ink)}
.toggle{display:flex;align-items:center;gap:10px;font-size:.9rem}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .primary{flex:1}
.confirm{background:var(--late-soft);color:var(--late);border-radius:12px;padding:10px 12px;font-size:.88rem;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.setgroup{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:14px}
.setgroup p{margin:0;font-size:.85rem;color:var(--muted)}
.msg{font-size:.85rem;color:var(--accent);margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<style>
.topbtns{display:flex;gap:6px}
.icon-btn.txt{font-size:.8rem;font-weight:700;font-family:var(--display)}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;border:none;background:none;padding:8px 6px;border-radius:9px;font-weight:600;font-size:.88rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.setgroup .label{font-size:.82rem}
html[dir="ltr"] body{font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif}

/* ---------- liquid glass ---------- */
.bgfx{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--bg);pointer-events:none}
.bgfx i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.85}
.bgfx .b1{width:70vmax;height:70vmax;background:var(--blob1);top:-25vmax;right:-20vmax}
.bgfx .b2{width:55vmax;height:55vmax;background:var(--blob2);bottom:-20vmax;left:-25vmax;opacity:.6}
.bgfx .b3{width:45vmax;height:45vmax;background:var(--blob3);top:30%;left:20%;opacity:.7}
@media (prefers-reduced-motion:no-preference){.bgfx .b1{animation:drift 26s ease-in-out infinite alternate}.bgfx .b2{animation:drift 32s ease-in-out infinite alternate-reverse}}
@keyframes drift{to{transform:translate(-6vmax,5vmax) scale(1.08)}}
.glass,.card,.tabs,.icon-btn,.item,.kpi,.hrow,.fchip,.empty,.sheet,.seg{
  background:var(--surface);border:1px solid var(--glass-border);
  -webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);
  box-shadow:var(--glass-shadow),inset 0 1px 0 var(--hl)}
.card{border-radius:24px}
.item{border-radius:18px;border-inline-start-width:1px;position:relative;overflow:hidden}
.item::before{content:"";position:absolute;inset-block:10px;inset-inline-start:0;width:4px;border-radius:0 4px 4px 0;background:var(--cat,var(--line))}
html[dir="rtl"] .item::before{border-radius:4px 0 0 4px}
.tabs{border-radius:16px;padding:4px}
.tabs button{padding:7px 12px;border-radius:12px}
.tabs button[aria-selected="true"]{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 85%,white),var(--accent));box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 40%,transparent),inset 0 1px 0 rgba(255,255,255,.35)}
.icon-btn{border-radius:14px}
.sheet{background:var(--surface-2);border-bottom:none;border-radius:28px 28px 0 0;-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%)}
.scrim{background:rgba(4,18,42,.28);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.field input[type=text],.field input[type=number]{background:var(--field);border:1px solid var(--glass-border);border-radius:14px}
.seg{background:var(--field)}
.seg button[aria-pressed="true"],.btn.primary,.fab{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 82%,white),var(--accent));color:var(--accent-ink);box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 38%,transparent),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.ghost{background:var(--accent-soft);border:1px solid var(--glass-border)}
.fab{border-radius:20px;border:1px solid rgba(255,255,255,.4)}
.meter,.stack{background:var(--accent-soft)}
.fchip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.catpick label{background:var(--field);border-color:var(--glass-border)}
.catpick label:has(input:checked){background:var(--accent);color:var(--accent-ink);border-color:transparent}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:1.05rem}
.brand .logo{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,var(--blob2),var(--accent));display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.brand .logo svg{width:16px;height:16px}

/* ---------- analysis ---------- */
.score{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{width:108px;height:108px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.ring .in b{font-family:var(--display);font-size:1.8rem;font-weight:700}
.ring .in span{font-size:.7rem;color:var(--muted)}
.score h2{margin:0 0 4px;font-family:var(--display);font-size:1.15rem}
.score p{margin:0;color:var(--muted);font-size:.88rem}
.ratios{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ratio{border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.ratio .top2{display:flex;justify-content:space-between;align-items:center;gap:6px}
.ratio .v{font-family:var(--display);font-weight:700;font-size:1.35rem}
.ratio .bar{height:6px;border-radius:99px;background:var(--accent-soft);position:relative;overflow:visible}
.ratio .bar i{display:block;height:100%;border-radius:99px}
.ratio .bar b{position:absolute;top:-3px;width:2px;height:12px;background:var(--ink);opacity:.5;border-radius:2px}
.ratio .tgt{font-size:.72rem;color:var(--muted)}
.pill{font-size:.7rem;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.pill.good{background:color-mix(in srgb,var(--paid) 16%,transparent);color:var(--paid)}
.pill.warn{background:var(--soon-soft);color:var(--soon)}
.pill.crit{background:var(--late-soft);color:var(--late)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.findings,.recs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.finding{display:flex;gap:10px;align-items:flex-start}
.finding .sev{flex:none;width:10px;height:10px;border-radius:50%;margin-top:7px}
.finding .sev.crit{background:var(--late)} .finding .sev.warn{background:var(--soon)} .finding .sev.good{background:var(--paid)} .finding .sev.info{background:var(--accent)}
.finding div{min-width:0}
.finding b{display:block;font-weight:600}
.finding span{font-size:.86rem;color:var(--muted)}
.rec{border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;background:var(--field);border:1px solid var(--glass-border)}
.rec .h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.rec .h b{font-weight:600;min-width:0}
.rec .sv{flex:none;font-weight:700;color:var(--paid);font-size:.9rem}
.rec p{margin:0;font-size:.86rem;color:var(--muted)}
.savebox{display:flex;justify-content:space-between;align-items:center;gap:10px;border-radius:18px;padding:14px 16px;background:linear-gradient(135deg,color-mix(in srgb,var(--paid) 18%,transparent),color-mix(in srgb,var(--accent) 14%,transparent));border:1px solid var(--glass-border)}
.savebox .v{font-family:var(--display);font-weight:700;font-size:1.4rem;color:var(--paid)}
.cmp{width:100%;border-collapse:collapse;font-size:.86rem}
.cmp th{font-weight:500;color:var(--muted);font-size:.75rem;text-align:start;padding:4px 0}
.cmp td{padding:7px 0;border-top:1px solid var(--line)}
.cmp td:not(:first-child),.cmp th:not(:first-child){text-align:end}
.up{color:var(--late)} .down{color:var(--paid)}
.ana-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ana-head h2{margin:0;font-family:var(--display);font-size:1.1rem;text-align:center}
.disclaimer{font-size:.75rem;color:var(--muted);text-align:center;margin:0}
</style>
<style>
.sub-seg{display:grid;grid-template-columns:1fr 1fr}
.legend.four{grid-template-columns:1fr 1fr;row-gap:10px}
.meter .exp{background:var(--k2)}
.daygrp{display:flex;flex-direction:column;gap:6px}
.dayhead{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);padding-inline:4px}
.exprow{display:flex;align-items:center;gap:10px;border-radius:16px;padding:10px 12px;width:100%;text-align:start}
.exprow .ic{flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center}
.exprow .ic i{width:10px;height:10px;border-radius:50%;display:block}
.exprow .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.exprow .tx b{font-weight:600;overflow-wrap:anywhere}
.exprow .tx span{font-size:.76rem;color:var(--muted)}
.exprow .am{flex:none;font-family:var(--display);font-weight:600}
.budget{display:flex;flex-direction:column;gap:6px}
.budget .row{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);gap:8px}
.linkbtn{background:none;border:none;color:var(--accent);font-weight:600;font-size:.82rem;padding:0}
.addline{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.amount-in{font-family:var(--display);font-size:1.6rem!important;font-weight:600;text-align:center}
.field input[type=date]{width:100%;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--glass-border);border-radius:14px;padding:10px 12px}
.field input[type=password]{width:100%;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--glass-border);border-radius:14px;padding:11px 12px}
/* auth */
.auth{min-height:calc(100vh - 140px);display:grid;place-items:center}
.auth .card{width:100%;max-width:400px;gap:16px}
.auth .hero{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.auth .hero .logo{width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,var(--blob2),var(--accent));display:grid;place-items:center;box-shadow:0 10px 30px color-mix(in srgb,var(--accent) 40%,transparent),inset 0 1px 0 rgba(255,255,255,.5)}
.auth .hero .logo svg{width:34px;height:34px}
.auth .hero h1{margin:0;font-family:var(--display);font-size:1.6rem}
.auth .hero p{margin:0;color:var(--muted);font-size:.9rem}
.pwwrap{position:relative}
.pwwrap button{position:absolute;inset-inline-end:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);font-size:.78rem;font-weight:600}
.acct{display:flex;align-items:center;gap:10px}
.acct .av{width:36px;height:36px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-family:var(--display)}
.cmp tr.grp td{color:var(--muted);font-size:.75rem;padding-top:12px;border-top:none}
</style>

<!-- AUTH -->
<div class="wrap auth" id="auth" hidden>
  <form class="card" id="authForm" autocomplete="on">
    <div class="hero">
      <span class="logo"><svg viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3.5" width="12" height="9" rx="2.2"/><path d="M2 6.5h12M10.5 9.5h1.5"/></svg></span>
      <h1 data-i="appName"></h1>
      <p data-i="tagline"></p>
    </div>
    <div class="seg" id="authSeg">
      <button type="button" data-v="login" aria-pressed="true" data-i="login"></button>
      <button type="button" data-v="register" aria-pressed="false" data-i="register"></button>
    </div>
    <div class="field"><label for="aUser" data-i="username"></label><input type="text" id="aUser" autocomplete="username" autocapitalize="none" spellcheck="false" dir="ltr"></div>
    <div class="field"><label for="aPass" data-i="password"></label><div class="pwwrap"><input type="password" id="aPass" autocomplete="current-password" dir="ltr"><button type="button" id="pwShow" data-i="show"></button></div></div>
    <div class="field" id="aPass2Wrap" hidden><label for="aPass2" data-i="password2"></label><input type="password" id="aPass2" autocomplete="new-password" dir="ltr"></div>
    <p class="msg neg" id="authErr" hidden></p>
    <button class="btn primary block" type="submit" id="authSubmit"></button>
    <p class="note" id="authHint"></p>
    <button class="linkbtn" type="button" id="authLang" style="align-self:center"></button>
  </form>
</div>

<!-- APP -->
<div class="wrap" id="app" hidden>
  <div class="top">
    <div class="brand"><span class="logo"><svg viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3.5" width="12" height="9" rx="2.2"/><path d="M2 6.5h12M10.5 9.5h1.5"/></svg></span><span data-i="appName"></span></div>
    <div class="topbtns">
      <button class="icon-btn txt" id="langBtn" type="button"></button>
      <button class="icon-btn" id="themeBtn" type="button"></button>
      <button class="icon-btn" id="setBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>
      </button>
    </div>
  </div>
  <div class="tabs" role="tablist" style="display:grid;grid-template-columns:repeat(3,1fr)">
    <button role="tab" id="tabMonth" aria-selected="true" type="button" data-i="tabMonth"></button>
    <button role="tab" id="tabAna" aria-selected="false" type="button" data-i="tabAna"></button>
    <button role="tab" id="tabHist" aria-selected="false" type="button" data-i="tabHist"></button>
  </div>

  <!-- MONTH -->
  <div id="viewMonth" class="wrap" style="gap:16px">
    <header class="month">
      <button class="icon-btn" id="prevM" type="button"></button>
      <h1 id="mTitle">—<small id="mSub"></small></h1>
      <button class="icon-btn" id="nextM" type="button"></button>
    </header>
    <section class="card">
      <div class="salary-row">
        <div class="big"><span class="label" data-i="leftSalary"></span><span class="v num" id="leftSalary">0</span></div>
        <button class="salary-btn" id="salaryBtn" type="button"><span class="label" data-i="salary"></span><span class="v num" id="salaryV">—</span><span class="edit" data-i="edit"></span></button>
      </div>
      <div class="meter" aria-hidden="true"><i class="paid" id="mPaid"></i><i class="exp" id="mExp"></i><i class="due" id="mDue"></i></div>
      <div class="legend four">
        <div><span class="label"><span class="dot" style="background:var(--paid)"></span><span data-i="paid"></span></span><span class="v num" id="paidV">0</span></div>
        <div><span class="label"><span class="dot" style="background:var(--k2)"></span><span data-i="daily"></span></span><span class="v num" id="expV">0</span></div>
        <div><span class="label"><span class="dot" style="background:var(--soon)"></span><span data-i="due"></span></span><span class="v num" id="dueV">0</span></div>
        <div><span class="label"><span class="dot" style="background:var(--accent-soft);outline:1px solid var(--line)"></span><span data-i="free"></span></span><span class="v num" id="freeV">0</span></div>
      </div>
    </section>

    <div class="seg sub-seg" id="subSeg">
      <button type="button" data-v="obl" aria-pressed="true" data-i="obligations"></button>
      <button type="button" data-v="exp" aria-pressed="false" data-i="dailyTab"></button>
    </div>

    <div id="panelObl" class="wrap" style="gap:16px">
      <section class="card" id="catCard" hidden>
        <div class="cats-head"><h2 data-i="byCat"></h2><span class="label" data-i="paidOfTotal"></span></div>
        <div class="stack" id="catStack" aria-hidden="true"></div>
        <div class="catrows" id="catRows"></div>
      </section>
      <div class="list-head"><h2 data-i="obligations"></h2><span id="countV"></span></div>
      <div class="filters" id="filters" role="group"></div>
      <ul class="list" id="list"></ul>
      <div id="emptyBox"></div>
    </div>

    <div id="panelExp" class="wrap" style="gap:16px" hidden>
      <section class="card">
        <div class="salary-row">
          <div class="big"><span class="label" data-i="spentMonth"></span><span class="v num" id="expTotal">0</span></div>
          <div class="big" style="text-align:end"><span class="label" data-i="perDay"></span><span class="num" style="font-family:var(--display);font-weight:600;font-size:1.1rem" id="expAvg">0</span></div>
        </div>
        <div class="budget" id="budgetBox"></div>
      </section>
      <section class="card" id="expCatCard" hidden>
        <div class="cats-head"><h2 data-i="byCat"></h2><span class="label" data-i="total"></span></div>
        <div class="stack" id="expCatStack" aria-hidden="true"></div>
        <div class="catrows" id="expCatRows"></div>
      </section>
      <div class="filters" id="expFilters" role="group"></div>
      <div id="expList" class="wrap" style="gap:14px"></div>
    </div>
  </div>

  <!-- ANALYSIS -->
  <div id="viewAna" class="wrap" style="gap:16px" hidden>
    <header class="ana-head">
      <button class="icon-btn" id="aPrev" type="button"></button>
      <h2 id="aTitle"></h2>
      <button class="icon-btn" id="aNext" type="button"></button>
    </header>
    <div id="anaBody" class="wrap" style="gap:16px"></div>
    <p class="disclaimer" data-i="disclaimer"></p>
  </div>

  <!-- HISTORY -->
  <div id="viewHist" class="wrap" style="gap:16px" hidden>
    <div class="kpis">
      <div class="kpi"><span class="label" data-i="kAvg"></span><span class="v num" id="kAvg">0</span></div>
      <div class="kpi"><span class="label" data-i="kExp"></span><span class="v num" id="kExp">0</span></div>
      <div class="kpi"><span class="label" data-i="kFree"></span><span class="v num" id="kFree">0</span></div>
      <div class="kpi"><span class="label" data-i="kCount"></span><span class="v num" id="kCount">0</span></div>
    </div>
    <section class="card" id="trendCard">
      <div class="cats-head"><h2 data-i="trendTitle"></h2><span class="label" data-i="last12"></span></div>
      <svg class="trend" id="trend" viewBox="0 0 340 150" role="img"></svg>
      <div class="legend" style="grid-template-columns:repeat(3,auto);justify-content:start;gap:14px">
        <span class="label"><span class="dot" style="background:var(--line);outline:1px solid var(--muted)"></span><span data-i="salary"></span></span>
        <span class="label"><span class="dot" style="background:var(--accent)"></span><span data-i="obligations"></span></span>
        <span class="label"><span class="dot" style="background:var(--k2)"></span><span data-i="daily"></span></span>
      </div>
    </section>
    <section class="card" id="hCatCard">
      <div class="cats-head"><h2 data-i="hCatTitle"></h2><span class="label" data-i="total"></span></div>
      <div class="stack" id="hCatStack" aria-hidden="true"></div>
      <div class="catrows" id="hCatRows"></div>
    </section>
    <section class="card" id="hExpCard">
      <div class="cats-head"><h2 data-i="hExpTitle"></h2><span class="label" data-i="total"></span></div>
      <div class="stack" id="hExpStack" aria-hidden="true"></div>
      <div class="catrows" id="hExpRows"></div>
    </section>
    <h2 class="sec-title" data-i="months"></h2>
    <ul class="hist" id="hist"></ul>
  </div>

  <p class="status" id="status"></p>
</div>

<button class="fab" id="addBtn" type="button" hidden><span aria-hidden="true">＋</span> <span id="fabLabel"></span></button>
<div class="scrim" id="scrim" hidden></div>

<!-- obligation / salary / budget sheet -->
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <form id="form" autocomplete="off">
    <h3 id="sheetTitle"></h3>
    <div id="itemBlock" style="display:flex;flex-direction:column;gap:14px">
      <div class="field"><label for="fName" data-i="fName"></label><input type="text" id="fName"></div>
      <fieldset class="field"><legend data-i="fCat"></legend><div class="catpick" id="catPick"></div></fieldset>
      <div class="row2">
        <div class="field"><label for="fAmt" data-i="fAmt"></label><input type="number" id="fAmt" inputmode="decimal" min="0" step="0.01"></div>
        <div class="field"><label for="fDay" data-i="fDay"></label><input type="number" id="fDay" inputmode="numeric" min="1" max="31"></div>
      </div>
      <label class="toggle"><input type="checkbox" id="fRec" checked> <span data-i="fRec"></span></label>
    </div>
    <div class="field" id="numField" hidden><label for="fNum" id="fNumLabel"></label><input type="number" id="fNum" inputmode="decimal" min="0" step="0.01"></div>
    <p class="msg neg" id="formErr" hidden></p>
    <div id="confirmBox"></div>
    <div class="actions">
      <button class="btn primary" type="submit" data-i="save"></button>
      <button class="btn ghost" type="button" data-close data-i="cancel"></button>
      <button class="btn danger" type="button" id="delBtn" hidden data-i="delete"></button>
    </div>
  </form>
</div>

<!-- daily expense sheet -->
<div class="sheet" id="expSheet" hidden role="dialog" aria-modal="true" aria-labelledby="expTitle">
  <form id="expForm" autocomplete="off">
    <h3 id="expTitle"></h3>
    <div class="field"><label for="eAmt" data-i="eAmt"></label><input type="number" id="eAmt" class="amount-in" inputmode="decimal" min="0" step="0.01" placeholder="0"></div>
    <fieldset class="field"><legend data-i="fCat"></legend><div class="catpick" id="expPick"></div></fieldset>
    <div class="row2">
      <div class="field"><label for="eNote" data-i="eNote"></label><input type="text" id="eNote"></div>
      <div class="field"><label for="eDate" data-i="eDate"></label><input type="date" id="eDate"></div>
    </div>
    <p class="msg neg" id="expErr" hidden></p>
    <div id="expConfirm"></div>
    <div class="actions">
      <button class="btn primary" type="submit" data-i="save"></button>
      <button class="btn ghost" type="button" data-close data-i="cancel"></button>
      <button class="btn danger" type="button" id="expDel" hidden data-i="delete"></button>
    </div>
  </form>
</div>

<!-- settings sheet -->
<div class="sheet" id="setSheet" hidden role="dialog" aria-modal="true" aria-labelledby="setTitle">
  <div class="inner">
    <h3 id="setTitle" data-i="settings"></h3>
    <div class="setgroup" id="acctGroup" hidden style="border-top:none;padding-top:0">
      <div class="acct"><span class="av" id="acctAv"></span><div><span class="label" data-i="signedInAs"></span><div style="font-weight:600" id="acctName" dir="ltr"></div></div></div>
      <div class="field"><label for="newPass" data-i="newPass"></label><input type="password" id="newPass" autocomplete="new-password" dir="ltr"></div>
      <button class="btn ghost block" type="button" id="chgPass" data-i="chgPass"></button>
      <button class="btn danger block" type="button" id="logoutBtn" data-i="logout"></button>
    </div>
    <div class="setgroup" id="langGroup">
      <span class="label" data-i="language"></span>
      <div class="seg" id="segLang"><button type="button" data-v="ar">العربية</button><button type="button" data-v="en">English</button></div>
    </div>
    <div class="setgroup">
      <span class="label" data-i="appearance"></span>
      <div class="seg" id="segTheme"><button type="button" data-v="light" data-i="light"></button><button type="button" data-v="dark" data-i="dark"></button><button type="button" data-v="system" data-i="system"></button></div>
    </div>
    <div class="setgroup">
      <span class="label" data-i="backup"></span>
      <p id="whereNote"></p>
      <button class="btn primary block" type="button" id="expJson" data-i="expJson"></button>
      <button class="btn ghost block" type="button" id="expCsv" data-i="expCsv"></button>
    </div>
    <div class="setgroup">
      <p data-i="impNote"></p>
      <label class="btn ghost block" style="text-align:center;cursor:pointer" for="impFile" data-i="impBtn"></label>
      <input type="file" id="impFile" accept=".json,application/json" hidden>
      <div id="impConfirm"></div>
    </div>
    <p class="msg" id="setMsg" hidden></p>
    <button class="btn ghost block" type="button" data-close data-i="close"></button>
  </div>
</div>

  function groupCats(list,set,getK,nameOf,withPaid){
    const m={};
    for(const it of list){ const k=getK(it); (m[k]=m[k]||{total:0,paid:0,n:0}); m[k].total+=+it.amount||0; if(withPaid&&it.paid) m[k].paid+=+it.amount||0; m[k].n++; }
    return set.filter(c=>m[c.k]).map(c=>({...c,name:nameOf(c.k),...m[c.k]})).sort((a,b)=>b.total-a.total);
  }
  const byCat=items=>groupCats(items,OCATS,i=>catOf(i.cat).k,catName,true);
  const byECat=ex=>groupCats(ex,ECATS,e=>ecatOf(e.cat).k,ecatName,false);
  function dueInfo(item,y,m){
    const day=Math.min(item.day,lastDay(y,m));
    const t0=new Date(today.getFullYear(),today.getMonth(),today.getDate());
    return {day,diff:Math.round((new Date(y,m,day)-t0)/86400000)};
  }
  function daysElapsed(k){ const nowK=keyOf(today); const [y,m]=k.split("-").map(Number); if(k<nowK) return lastDay(y,m-1); if(k>nowK) return 0; return today.getDate(); }

  /* ================= render ================= */
  function render(){
    if($("app").hidden) return;
    $("viewMonth").hidden=view!=="month"; $("viewAna").hidden=view!=="ana"; $("viewHist").hidden=view!=="hist";
    $("addBtn").hidden=view!=="month";
    $("fabLabel").textContent=sub==="exp"?T("newExp"):T("newOb");
    $("tabMonth").setAttribute("aria-selected",view==="month"); $("tabAna").setAttribute("aria-selected",view==="ana"); $("tabHist").setAttribute("aria-selected",view==="hist");
    if(view==="hist") renderHist(); else if(view==="ana") renderAnalysis(); else renderMonth();
  }
  function renderCatBlock(stackEl,rowsEl,cats,showPaid){
    const tot=sum(cats,c=>c.total)||1;
    stackEl.innerHTML=cats.map(c=>'<i style="width:'+(c.total/tot*100)+'%;background:'+c.c+'"></i>').join("");
    rowsEl.innerHTML=cats.map(c=>'<div class="catrow"><span class="dot" style="background:'+c.c+'"></span><span class="nm">'+esc(c.name)+' <span class="sub num">'+Math.round(c.total/tot*100)+'%</span></span><span class="amt2 num">'+(showPaid?fmt(c.paid)+" / "+fmt(c.total):fmt(c.total))+'</span></div>').join("");
  }
  function chips(el,cats,active,onPick){
    el.innerHTML="";
    if(cats.length<=1){ el.hidden=true; return; }
    el.hidden=false;
    const mk=(k,label,color)=>{ const b=document.createElement("button"); b.type="button"; b.className="fchip"; b.setAttribute("aria-pressed",active===k);
      b.innerHTML=(color?'<span class="dot" style="background:'+color+'"></span>':'')+esc(label); b.onclick=()=>onPick(k); el.appendChild(b); };
    mk("all",T("all"),null); cats.forEach(c=>mk(c.k,c.name,c.c));
  }

  function renderMonth(){
    const k=keyOf(cur), y=cur.getFullYear(), m=cur.getMonth();
    const mo=peek(k)||{salary:0,budget:0,items:[],expenses:[]};
    $("mTitle").firstChild.nodeValue=MONTHS()[m]+" "+y;
    const nowK=keyOf(today);
    $("mSub").textContent=k===nowK?T("curMonth"):(k<nowK?T("pastMonth"):T("nextMonth"));
    const t=totals(mo);
    $("salaryV").innerHTML=t.salary?curHtml(t.salary):esc(T("addSalary"));
    $("leftSalary").innerHTML=curHtml(t.left); $("leftSalary").classList.toggle("neg",t.left<0);
    $("paidV").textContent=fmt(t.paid); $("expV").textContent=fmt(t.exp); $("dueV").textContent=fmt(t.due);
    $("freeV").textContent=fmt(t.free); $("freeV").classList.toggle("neg",t.free<0);
    const base=Math.max(t.salary,t.total+t.exp,1);
    $("mPaid").style.width=(t.paid/base*100)+"%"; $("mExp").style.width=(t.exp/base*100)+"%"; $("mDue").style.width=(t.due/base*100)+"%";
    document.querySelectorAll("#subSeg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===sub));
    $("panelObl").hidden=sub!=="obl"; $("panelExp").hidden=sub!=="exp";
    if(sub==="exp") return renderExp(k,mo,t);

    const cats=byCat(mo.items);
    $("catCard").hidden=!cats.length;
    if(cats.length) renderCatBlock($("catStack"),$("catRows"),cats,true);
    if(filter!=="all"&&!cats.find(c=>c.k===filter)) filter="all";
    chips($("filters"),cats,filter,f=>{filter=f;render();});
    const items=[...mo.items].filter(i=>filter==="all"||catOf(i.cat).k===filter).sort((a,b)=>(a.paid-b.paid)||(a.day-b.day));
    const unpaid=mo.items.filter(i=>!i.paid).length;
    $("countV").textContent=mo.items.length?(unpaid?T("left")(unpaid,mo.items.length):T("allPaid")):"";
    const ul=$("list"); ul.innerHTML="";
    for(const it of items){
      const {day,diff}=dueInfo(it,y,m); const c=catOf(it.cat);
      const li=document.createElement("li"); li.className="item"+(it.paid?" is-paid":""); li.style.setProperty("--cat",c.c);
      let chip="";
      if(it.paid) chip='<span class="chip ok">'+T("paid")+'</span>';
      else if(diff<0) chip='<span class="chip late">'+T("lateBy")(-diff)+'</span>';
      else if(diff===0) chip='<span class="chip late">'+T("dueToday")+'</span>';
      else if(diff<=3) chip='<span class="chip soon">'+T("inDays")(diff)+'</span>';
      li.innerHTML='<button class="check" type="button" aria-label="'+(it.paid?T("unmarkPaid"):T("markPaid"))+'"><svg viewBox="0 0 16 16" fill="none" stroke="var(--accent-ink)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg></button>'+
        '<button class="body" type="button"><span class="name">'+esc(it.name)+'</span><span class="meta"><span>'+esc(catName(it.cat))+'</span><span class="num">· '+T("day")(day)+'</span>'+(it.recurring?'<span>· '+T("monthly")+'</span>':'')+chip+'</span></button>'+
        '<span class="amt num">'+fmt(+it.amount||0)+'</span>';
      li.querySelector(".check").onclick=()=>{ const x=month(k).items.find(z=>z.id===it.id); x.paid=!x.paid; x.paidAt=x.paid?ymd(new Date()):null; render(); persist(); };
      li.querySelector(".body").onclick=()=>openItem(it.id);
      ul.appendChild(li);
    }
    const box=$("emptyBox"); box.innerHTML="";
    if(!ready){ box.innerHTML='<div class="empty"><p>'+T("loading")+'</p></div>'; return; }
    if(!mo.items.length){
      const prevKey=keyOf(new Date(y,m-1,1)); const prev=peek(prevKey);
      const rec=prev?prev.items.filter(i=>i.recurring):[];
      const div=document.createElement("div"); div.className="empty";
      if(rec.length){
        div.innerHTML='<p>'+T("emptyMonth")+'</p><p class="num">'+esc(T("recFrom")(rec.length,monthName(prevKey),fmt(sum(rec,i=>i.amount))))+'</p>';
        const b=document.createElement("button"); b.className="btn primary"; b.type="button"; b.textContent=T("moveThem");
        b.onclick=()=>{ const mo2=month(k); mo2.items=rec.map(i=>({id:uid(),name:i.name,amount:i.amount,day:i.day,cat:i.cat,recurring:true,paid:false,paidAt:null})); if(!mo2.salary&&prev.salary) mo2.salary=prev.salary; if(!mo2.budget&&prev.budget) mo2.budget=prev.budget; render(); persist(); };
        div.appendChild(b);
      } else {
        div.innerHTML='<p>'+T("startHint")+'</p>';
        const b=document.createElement("button"); b.className="btn ghost"; b.type="button"; b.textContent=T("tryExample"); b.onclick=loadExample; div.appendChild(b);
        const n=document.createElement("p"); n.className="note"; n.textContent=T("exampleNote"); div.appendChild(n);
      }
      box.appendChild(div);
    }
  }

  function renderExp(k,mo,t){
    const [y,m]=k.split("-").map(Number);
    const de=daysElapsed(k);
    $("expTotal").innerHTML=curHtml(t.exp);
    $("expAvg").textContent=de?fmt(Math.round(t.exp/de)):"—";
    const bb=$("budgetBox");
    if(t.budget){
      const used=t.exp/t.budget, col=used>1?"var(--late)":used>0.85?"var(--soon)":"var(--paid)";
      const proj=(k===keyOf(today)&&de)?t.exp/de*lastDay(y,m-1):0;
      bb.innerHTML='<div class="row"><span>'+esc(T("budgetT"))+'</span><button class="linkbtn" type="button" id="budEdit">'+esc(T("editBudget"))+'</button></div>'+
        '<div class="meter" style="height:10px"><i style="width:'+Math.min(100,used*100)+'%;background:'+col+'"></i></div>'+
        '<div class="row num"><span>'+esc(T("budgetOf")(fmt(t.exp),fmt(t.budget)))+'</span><span style="color:'+col+'">'+esc(used>1?T("budgetOver")(fmt(t.exp-t.budget)):T("budgetLeft")(fmt(t.budget-t.exp)))+'</span></div>'+
        (proj?'<div class="row num"><span'+(proj>t.budget?' class="neg"':'')+'>'+esc(T("projected")(fmt(Math.round(proj))+" "+T("cur")))+'</span></div>':'');
    } else bb.innerHTML='<button class="linkbtn" type="button" id="budEdit" style="text-align:start">＋ '+esc(T("setBudget"))+'</button>';
    $("budEdit").onclick=openBudget;

    const cats=byECat(mo.expenses);
    $("expCatCard").hidden=!cats.length;
    if(cats.length) renderCatBlock($("expCatStack"),$("expCatRows"),cats,false);
    if(efilter!=="all"&&!cats.find(c=>c.k===efilter)) efilter="all";
    chips($("expFilters"),cats,efilter,f=>{efilter=f;render();});

    const list=$("expList"); list.innerHTML="";
    const ex=mo.expenses.filter(e=>efilter==="all"||ecatOf(e.cat).k===efilter).sort((a,b)=>b.date.localeCompare(a.date));
    if(!ready){ list.innerHTML='<div class="empty"><p>'+T("loading")+'</p></div>'; return; }
    if(!mo.expenses.length){ list.innerHTML='<div class="empty"><p>'+esc(T("expEmpty"))+'</p></div>'; return; }
    const dfmt=new Intl.DateTimeFormat(lang==="ar"?"ar-EG-u-nu-latn":"en-US",{weekday:"long",day:"numeric",month:"long"});
    const groups={}; ex.forEach(e=>{ (groups[e.date]=groups[e.date]||[]).push(e); });
    for(const d of Object.keys(groups)){
      const g=document.createElement("div"); g.className="daygrp";
      const [yy,mm,dd]=d.split("-").map(Number);
      g.innerHTML='<div class="dayhead"><span>'+esc(dfmt.format(new Date(yy,mm-1,dd)))+'</span><span class="num">'+fmt(sum(groups[d],e=>e.amount))+'</span></div>';
      for(const e of groups[d]){
        const c=ecatOf(e.cat);
        const b=document.createElement("button"); b.type="button"; b.className="exprow glass";
        b.innerHTML='<span class="ic" style="background:color-mix(in srgb,'+c.c+' 16%,transparent)"><i style="background:'+c.c+'"></i></span><span class="tx"><b>'+esc(e.note||ecatName(e.cat))+'</b><span>'+(e.note?esc(ecatName(e.cat)):'')+'</span></span><span class="am num">'+fmt(e.amount)+'</span>';
        b.onclick=()=>openExp(e.id);
        g.appendChild(b);
      }
      list.appendChild(g);
    }
  }

      fTopExp:(c,p)=>[c+" is your biggest daily category",p+" of daily spending."],
      fOverdue:(n,a)=>["Overdue obligations",n+" past due and unpaid, totaling "+a+" SAR."],
      fLateHist:(n,p)=>["Frequent late payments",n+" payments were made after their due day ("+p+" of recorded payments)."],
      fNoExp:["No daily spending logged","Log daily spending so the analysis can catch money you don't notice leaving."],
      rDeficit:["Stop non-essential spending now","Rank items from least to most essential, starting with eating out, shopping and entertainment, until spending fits your salary."],
      rHouse:["Review housing cost","Negotiate at renewal, or compare a smaller or closer place when the lease ends."],
      rDebt:["Avoid new loans","Direct any early repayment to the most expensive loan, and ask your bank about refinancing at a lower rate."],
      rSubs:["Trim subscriptions","Cancel anything you didn't use last month, and switch the rest to annual plans where cheaper."],
      rBills:["Lower your bills","Review mobile and internet plans, and watch electricity and A/C usage."],
      rTrans:["Cut transport costs","Combine trips, and compare insurance and maintenance prices."],
      rOut:["Cap eating out","Set a weekly number of restaurant and café visits, and bring lunch to work."],
      rShop:["Wait 48 hours before buying","Hold off two days on anything non-essential, and remove saved cards from shopping sites."],
      rGroc:["Plan grocery runs","Shop from a weekly list and buy staples in bulk."],
      rBudget:["Stick to your daily budget",""],
      rBudgetD:a=>"To stay on budget, keep daily spending under "+a+" SAR for the rest of the month.",
      rSetBudget:a=>["Set a daily-spending budget","Start with "+a+" SAR a month (10% below your average) and track it in the Daily spending tab."],
      rSmall:["Watch the small stuff","Small repeat buys like coffee and snacks can often be halved without noticing."],
      rGrow:c=>["Bring "+c+" back to normal","This category is above your average — find what changed and set a monthly cap."],
      rLate:["Pay right after payday","Pay all obligations within 3 days of salary, or set up auto-debit, to avoid late fees."],
      rSave:a=>["Pay yourself first","Move "+a+" SAR to savings on payday before spending anything; that gets you to 20%."],
      rAuto:a=>["Put the surplus to work","You have "+a+" SAR left. Auto-transfer a fixed part to an emergency fund covering 3–6 months of spending."]
    }
  };
  const AT=k=>A[lang][k];

  function analyze(k){
    const mo=peek(k)||{salary:0,budget:0,items:[],expenses:[]}; const t=totals(mo); const S=t.salary;
    const [y,mN]=k.split("-").map(Number); const nowK=keyOf(today);
    const de=daysElapsed(k), dim=lastDay(y,mN-1);
    const isCur=k===nowK, projF=(isCur&&de>=5)?dim/de:1;
    const cats=byCat(mo.items), ecats=byECat(mo.expenses);
    const ct=key=>(cats.find(c=>c.k===key)||{total:0,n:0}), ect=key=>(ecats.find(c=>c.k===key)||{total:0,n:0});
    const priorO=Object.keys(state.months).filter(x=>x<k&&state.months[x].items.length).sort().slice(-3);
    const priorE=Object.keys(state.months).filter(x=>x<k&&state.months[x].expenses.length).sort().slice(-3);
    const F=[],R=[],recCats=new Set();
    const add=(arr,sev,pair,extra)=>arr.push(Object.assign({sev,t:pair[0],d:pair[1]},extra||{}));
    const expP=t.exp*projF, freeP=S-t.total-expP;
    const r={obl:S?t.total/S:0, exp:S?t.exp/S:0, sav:S?freeP/S:0, debt:S?ct("loans").total/S:0, house:S?ct("housing").total/S:0};

    if(freeP<0){ add(F,"crit",AT("fDeficit")(fmt(Math.round(-freeP)))); add(R,"crit",AT("rDeficit")); }
    if(r.obl>0.5) add(F,r.obl>0.7?"crit":"warn",AT("fOblHigh")(pct(r.obl))); else if(t.total) add(F,"good",AT("fOblOk")(pct(r.obl)));
    if(r.exp*projF>0.3) add(F,r.exp*projF>0.45?"crit":"warn",AT("fExpHigh")(pct(r.exp*projF)));
    if(freeP>=0){
      if(r.sav<0.2){ add(F,"warn",AT("fSavLow")(pct(r.sav),fmt(Math.round(0.2*S-freeP)))); add(R,"warn",AT("rSave")(fmt(0.2*S)),{target:0.2*S}); }
      else add(F,"good",AT("fSavOk")(pct(r.sav)));
    }
    if(r.house>0.3){ const ex=ct("housing").total-0.3*S; add(F,r.house>0.4?"crit":"warn",AT("fHouse")(pct(r.house),fmt(ex))); add(R,"warn",AT("rHouse"),{save:ex}); recCats.add("o:housing"); }
    if(r.debt>0.33){ add(F,r.debt>0.45?"crit":"warn",AT("fDebt")(pct(r.debt))); add(R,"warn",AT("rDebt")); }
    const subs=ct("subs"); if(subs.total>0&&(subs.n>=3||subs.total>0.05*S)){ add(F,"warn",AT("fSubs")(subs.n,fmt(subs.total))); add(R,"warn",AT("rSubs"),{save:subs.total*0.3}); recCats.add("o:subs"); }
    const bills=ct("bills"); if(bills.total>0.10*S){ add(F,"warn",AT("fBills")(pct(bills.total/S))); add(R,"warn",AT("rBills"),{save:bills.total*0.15}); recCats.add("o:bills"); }
    const trv=ct("transport").total+ect("fuel").total*projF; if(trv>0.15*S){ add(F,"warn",AT("fTrans")(pct(trv/S))); add(R,"warn",AT("rTrans"),{save:trv*0.10}); recCats.add("o:transport"); recCats.add("e:fuel"); }

    // daily spending
    if(mo.expenses.length){
      const out=(ect("dining").total+ect("fun").total)*projF;
      if(out>0.10*S){ add(F,"warn",AT("fOut")(pct(out/S),fmt(Math.round(out)))); add(R,"warn",AT("rOut"),{save:out*0.25}); recCats.add("e:dining"); recCats.add("e:fun"); }
      const shop=ect("shopping").total*projF;
      if(shop>0.10*S){ add(F,"warn",AT("fShop")(pct(shop/S),fmt(Math.round(shop)))); add(R,"warn",AT("rShop"),{save:shop*0.25}); recCats.add("e:shopping"); }
      const groc=ect("groceries").total*projF;
      if(groc>0.15*S){ add(F,"warn",AT("fGroc")(pct(groc/S))); add(R,"warn",AT("rGroc"),{save:groc*0.10}); recCats.add("e:groceries"); }
      const small=mo.expenses.filter(e=>e.amount<30);
      if(small.length>=10){ const sa=sum(small,e=>e.amount); add(F,"info",AT("fSmall")(small.length,fmt(sa)));
        if(!small.some(e=>recCats.has("e:"+ecatOf(e.cat).k))) add(R,"warn",AT("rSmall"),{save:sa*0.5*projF}); }
      if(ecats.length>1) add(F,"info",AT("fTopExp")(ecats[0].name,pct(ecats[0].total/t.exp)));
      if(t.budget){
        if(t.exp>t.budget) add(F,"warn",AT("fBudOver")(fmt(t.exp),fmt(t.budget)));
        else if(isCur&&de>=5&&t.exp*projF>t.budget){ add(F,"warn",AT("fBudProj")(fmt(Math.round(t.exp*projF)),fmt(t.budget)));
          const rest=dim-de; if(rest>0) add(R,"warn",[AT("rBudget")[0],AT("rBudgetD")(fmt(Math.max(0,Math.floor((t.budget-t.exp)/rest))))]); }
      } else if(priorE.length){
        const avg=sum(priorE,x=>sum(state.months[x].expenses,e=>e.amount))/priorE.length;
        if(avg>0) add(R,"info",AT("rSetBudget")(fmt(Math.round(avg*0.9/50)*50)));
      }
    } else if(isCur||k<nowK) add(F,"info",AT("fNoExp"));

    // comparison vs previous months
    const cmpO=[],cmpE=[];
    if(priorO.length){
      const avgOf=key=>sum(priorO,x=>sum(state.months[x].items.filter(i=>catOf(i.cat).k===key),i=>i.amount))/priorO.length;
      const keys=new Set(cats.map(c=>c.k)); priorO.forEach(x=>state.months[x].items.forEach(i=>keys.add(catOf(i.cat).k)));
      for(const key of OCATS.map(c=>c.k).filter(x=>keys.has(x))){
        const now=ct(key).total, avg=avgOf(key); cmpO.push({k:key,now,avg,chg:avg?(now-avg)/avg:0});
        if(avg>0&&now>avg*1.15&&now-avg>=100){
          const fixed=["housing","loans","family","education"].includes(key);
          add(F,fixed?"info":"warn",AT("fGrow")(catName(key),pct((now-avg)/avg),fmt(now-avg)));
          if(!fixed&&!recCats.has("o:"+key)){ add(R,"warn",AT("rGrow")(catName(key)),{save:now-avg}); recCats.add("o:"+key); }
        }
      }
      cmpO.sort((a,b)=>b.now-a.now);
    }
    if(priorE.length&&mo.expenses.length&&(!isCur||de>=5)){
      const avgOf=key=>sum(priorE,x=>sum(state.months[x].expenses.filter(e=>ecatOf(e.cat).k===key),e=>e.amount))/priorE.length;
      const keys=new Set(ecats.map(c=>c.k)); priorE.forEach(x=>state.months[x].expenses.forEach(e=>keys.add(ecatOf(e.cat).k)));
      for(const key of ECATS.map(c=>c.k).filter(x=>keys.has(x))){
        const now=ect(key).total*projF, avg=avgOf(key); cmpE.push({k:key,now,avg,chg:avg?(now-avg)/avg:0});
        if(avg>0&&now>avg*1.2&&now-avg>=100&&key!=="health"&&key!=="kids"){
          add(F,"warn",AT("fGrow")(ecatName(key),pct((now-avg)/avg),fmt(Math.round(now-avg))));
          if(!recCats.has("e:"+key)){ add(R,"warn",AT("rGrow")(ecatName(key)),{save:now-avg}); recCats.add("e:"+key); }
        }
      }
      cmpE.sort((a,b)=>b.now-a.now);
    }
    if(cats.length>1&&t.total&&cats[0].total/t.total>0.5) add(F,"info",AT("fConc")(cats[0].name,pct(cats[0].total/t.total)));

    // payment punctuality
    let lateN=0,paidN=0,hasOverdue=false;
    if(isCur){ const od=mo.items.filter(i=>!i.paid&&dueInfo(i,y,mN-1).diff<0); if(od.length){ hasOverdue=true; add(F,"crit",AT("fOverdue")(od.length,fmt(sum(od,i=>i.amount)))); } }
    for(const [mk,m2] of Object.entries(state.months)){ const [yy,mm]=mk.split("-").map(Number);
      for(const i of m2.items){ if(!i.paid||!i.paidAt) continue; paidN++; if(i.paidAt>mk+"-"+String(Math.min(i.day,lastDay(yy,mm-1))).padStart(2,"0")) lateN++; } }
    if(lateN>=2&&paidN&&lateN/paidN>=0.15){ add(F,"warn",AT("fLateHist")(lateN,pct(lateN/paidN))); add(R,"warn",AT("rLate")); }
    else if(hasOverdue) add(R,"warn",AT("rLate"));
    if(freeP>0&&r.sav>=0.2) add(R,"good",AT("rAuto")(fmt(Math.round(freeP))));

    let sc=100;
    sc-=Math.min(35,Math.max(0,r.obl-0.5)*100*0.8);
    sc-=Math.min(30,Math.max(0,0.2-r.sav)*100);
    sc-=Math.min(15,Math.max(0,r.exp*projF-0.3)*100);
    sc-=Math.min(10,Math.max(0,r.house-0.3)*100);
    sc-=Math.min(10,Math.max(0,r.debt-0.33)*100);
    sc-=Math.min(10,F.filter(f=>f.sev==="crit").length*5);
    sc=Math.round(Math.max(0,Math.min(100,sc)));
    const order={crit:0,warn:1,info:2,good:3};
    F.sort((a,b)=>order[a.sev]-order[b.sev]); R.sort((a,b)=>order[a.sev]-order[b.sev]);
    return {mo,t,S,r,F,R,cmpO,cmpE,priorN:Math.max(priorO.length,priorE.length),isCur,score:sc,potential:sum(R,x=>x.save||0)};
  }

  function renderAnalysis(){
    const k=keyOf(cur); $("aTitle").textContent=monthName(k);
    const box=$("anaBody"); const a=analyze(k);
    if(!a.S||(!a.mo.items.length&&!a.mo.expenses.length)){
      box.innerHTML='<div class="empty"><p>'+esc(!a.S?AT("noSalary"):AT("noItems"))+'</p><button class="btn primary" type="button" id="goM">'+esc(AT("goMonth"))+'</button></div>';
      $("goM").onclick=()=>{ view="month"; render(); }; return;
    }
    const lvl=a.score>=80?"exc":a.score>=60?"good":a.score>=40?"watch":"crit";
    const ringColor={exc:"var(--paid)",good:"var(--accent)",watch:"var(--soon)",crit:"var(--late)"}[lvl];
    const C=2*Math.PI*44;
    const stat=(v,warn,crit,higherBad)=>higherBad?(v>crit?"crit":v>warn?"warn":"good"):(v<crit?"crit":v<warn?"warn":"good");
    const tile=(name,v,mark,status,tgt)=>{ const col={good:"var(--paid)",warn:"var(--soon)",crit:"var(--late)"}[status];
      return '<div class="ratio glass"><div class="top2"><span class="label">'+esc(name)+'</span><span class="pill '+status+'">'+esc(AT("pill")[status])+'</span></div><span class="v num">'+pct(v)+'</span><span class="bar"><i style="width:'+Math.max(0,Math.min(100,v*100))+'%;background:'+col+'"></i><b style="inset-inline-start:'+(mark*100)+'%"></b></span><span class="tgt">'+esc(tgt)+'</span></div>'; };
    let h='<section class="card"><div class="score"><div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="var(--accent-soft)" stroke-width="10"/><circle cx="50" cy="50" r="44" fill="none" stroke="'+ringColor+'" stroke-width="10" stroke-linecap="round" stroke-dasharray="'+(C*a.score/100)+' '+C+'"/></svg><div class="in"><div><b class="num">'+a.score+'</b><br><span>'+esc(AT("of100"))+'</span></div></div></div>'+
      '<div><h2>'+esc(AT("scoreTitle"))+' · <span style="color:'+ringColor+'">'+esc(AT("lv")[lvl])+'</span></h2><p class="num">'+esc(AT("scoreSub")(pct(a.r.obl),pct(a.r.exp),fmt(a.t.free)+" "+T("cur")))+'</p></div></div></section>';
    h+='<div class="ratios">'+tile(AT("rObl"),a.r.obl,0.5,stat(a.r.obl,0.5,0.7,true),AT("tgtMax")("50%"))+tile(AT("rExp"),a.r.exp,0.3,stat(a.r.exp,0.3,0.45,true),AT("tgtMax")("30%"))+
      tile(AT("rSav"),Math.max(0,a.r.sav),0.2,stat(a.r.sav,0.2,0,false),AT("tgtMin")("20%"))+tile(AT("rDebt"),a.r.debt,0.33,stat(a.r.debt,0.33,0.45,true),AT("tgtMax")("33%"))+'</div>';
    h+='<section class="card"><h2 class="sec-title">'+esc(AT("whereTitle"))+'</h2><ul class="findings">'+a.F.map(f=>'<li class="finding"><i class="sev '+f.sev+'"></i><div><b>'+esc(f.t)+'</b><span class="num">'+esc(f.d)+'</span></div></li>').join("")+'</ul></section>';
    if(a.R.length){
      h+='<section class="card"><h2 class="sec-title">'+esc(AT("recTitle"))+'</h2>';
      if(a.potential>0) h+='<div class="savebox"><div><span class="label">'+esc(AT("potTitle"))+'</span><div class="v num">'+fmt(Math.round(a.potential))+' <span class="cur">'+T("cur")+'</span></div></div><span class="label num" style="max-width:50%;text-align:end">'+esc(AT("potYear")(fmt(Math.round(a.potential*12))))+'</span></div>';
      h+='<ul class="recs">'+a.R.map(r=>'<li class="rec"><div class="h"><b>'+esc(r.t)+'</b>'+(r.save?'<span class="sv num">−'+fmt(Math.round(r.save))+' '+T("cur")+'</span>':(r.target?'<span class="pill info num">'+esc(AT("target"))+' '+fmt(Math.round(r.target))+'</span>':''))+'</div>'+(r.d?'<p class="num">'+esc(r.d)+'</p>':'')+'</li>').join("")+'</ul></section>';
    }
    h+='<section class="card"><div class="cats-head"><h2>'+esc(AT("cmpTitle"))+'</h2>'+(a.priorN?'<span class="label">'+esc(AT("vsN")(a.priorN))+'</span>':'')+'</div>';
    if(!a.cmpO.length&&!a.cmpE.length) h+='<p class="note" style="text-align:start">'+esc(AT("noCmp"))+'</p>';
    else{
      const row=(c,nm,col)=>{ const cls=c.chg>0.05?"up":c.chg<-0.05?"down":""; return '<tr><td><span class="dot" style="background:'+col+'"></span>'+esc(nm)+'</td><td>'+fmt(Math.round(c.now))+'</td><td>'+fmt(Math.round(c.avg))+'</td><td class="'+cls+'">'+(c.avg?(c.chg>0?"+":"")+Math.round(c.chg*100)+"%":"—")+'</td></tr>'; };
      h+='<div style="overflow-x:auto"><table class="cmp num"><thead><tr><th>'+esc(AT("thCat"))+'</th><th>'+esc(AT("thNow"))+'</th><th>'+esc(AT("thAvg"))+'</th><th>'+esc(AT("thChg"))+'</th></tr></thead><tbody>'+
        (a.cmpO.length?'<tr class="grp"><td colspan="4">'+esc(AT("grpObl"))+'</td></tr>'+a.cmpO.map(c=>row(c,catName(c.k),catOf(c.k).c)).join(""):"")+
        (a.cmpE.length?'<tr class="grp"><td colspan="4">'+esc(AT("grpExp"))+'</td></tr>'+a.cmpE.map(c=>row(c,ecatName(c.k),ecatOf(c.k).c)).join(""):"")+'</tbody></table></div>';
      if(a.isCur&&a.cmpE.length) h+='<p class="note" style="text-align:start">'+esc(AT("projNote"))+'</p>';
    }
    h+='</section>'; box.innerHTML=h;
  }

  /* ================= history ================= */
  function renderHist(){
    const keys=Object.keys(state.months).filter(k=>hasData(state.months[k])).sort().reverse();
    const nowK=keyOf(today); const past=keys.filter(k=>k<=nowK);
    const rows=past.map(k=>({k,...totals(state.months[k])})); const n=rows.length||1;
    $("kAvg").innerHTML=curHtml(sum(rows,r=>r.total)/n); $("kExp").innerHTML=curHtml(sum(rows,r=>r.exp)/n);
    $("kFree").innerHTML=curHtml(sum(rows,r=>r.free)/n); $("kFree").classList.toggle("neg",sum(rows,r=>r.free)<0);
    $("kCount").textContent=rows.length;
    const tr=rows.slice(0,12).reverse(); const svg=$("trend"); svg.setAttribute("aria-label",T("trendTitle"));
    $("trendCard").hidden=!tr.length;
    if(tr.length){
      const W=340,H=150,padT=10,padB=26,padX=6,rtl=lang==="ar";
      const max=Math.max(1,...tr.map(r=>Math.max(r.salary,r.total+r.exp)));
      const slot=(W-padX*2)/tr.length, bw=Math.min(22,slot*0.32), yv=v=>padT+(H-padT-padB)*(1-v/max);
      let g=''; [0,.5,1].forEach(f=>{ const yy=yv(max*f); g+='<line x1="0" x2="'+W+'" y1="'+yy+'" y2="'+yy+'" stroke="var(--line)" stroke-width="1"/>'; });
      tr.forEach((r,i)=>{
        const cx=rtl?W-padX-slot*(i+0.5):padX+slot*(i+0.5), sx=rtl?cx-bw-1:cx+1, ox=rtl?cx+1:cx-bw-1;
        g+='<rect x="'+sx+'" y="'+yv(r.salary)+'" width="'+bw+'" height="'+(H-padB-yv(r.salary))+'" rx="3" fill="var(--line)" stroke="var(--muted)" stroke-width=".6"/>';
        g+='<rect x="'+ox+'" y="'+yv(r.total)+'" width="'+bw+'" height="'+(H-padB-yv(r.total))+'" fill="var(--accent)"/>';
        g+='<rect x="'+ox+'" y="'+yv(r.total+r.exp)+'" width="'+bw+'" height="'+(yv(r.total)-yv(r.total+r.exp))+'" fill="var(--k2)"/>';
        g+='<text x="'+cx+'" y="'+(H-8)+'" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="IBM Plex Sans Arabic,system-ui">'+MONTHS()[+r.k.split("-")[1]-1].slice(0,3)+'</text>';
      });
      g+='<text x="'+(rtl?W-2:2)+'" y="'+(padT+9)+'" text-anchor="'+(rtl?"end":"start")+'" font-size="9" fill="var(--muted)" font-family="system-ui">'+fmt(max)+'</text>';
      svg.innerHTML=g;
    }
    const hc=byCat(past.flatMap(k=>state.months[k].items)); $("hCatCard").hidden=!hc.length; if(hc.length) renderCatBlock($("hCatStack"),$("hCatRows"),hc,false);
    const he=byECat(past.flatMap(k=>state.months[k].expenses)); $("hExpCard").hidden=!he.length; if(he.length) renderCatBlock($("hExpStack"),$("hExpRows"),he,false);
    const ul=$("hist"); ul.innerHTML="";
    if(!keys.length){ ul.innerHTML='<li class="empty"><p>'+T("histEmpty")+'</p></li>'; return; }
    for(const k of keys){
      const t=totals(state.months[k]), mo=state.months[k], p=t.total?Math.round(t.paid/t.total*100):0, b2=Math.max(t.salary,t.total+t.exp,1);
      const li=document.createElement("li"), b=document.createElement("button"); b.type="button"; b.className="hrow";
      b.innerHTML='<span class="t"><span class="mn">'+esc(monthName(k)+(k===nowK?T("current"):""))+'</span><span class="label num">'+esc(T("salary")+" "+fmt(t.salary))+'</span></span>'+
        '<span class="meter" aria-hidden="true" style="height:8px"><i class="paid" style="width:'+(t.paid/b2*100)+'%"></i><i class="exp" style="width:'+(t.exp/b2*100)+'%"></i><i class="due" style="width:'+(t.due/b2*100)+'%"></i></span>'+
        '<span class="grid"><div><span class="label">'+T("obligations")+'</span><b class="num">'+fmt(t.total)+'</b></div><div><span class="label">'+T("daily")+'</span><b class="num">'+fmt(t.exp)+'</b></div><div><span class="label">'+T("surplus")+'</span><b class="num'+(t.free<0?' neg':'')+'">'+fmt(t.free)+'</b></div></span>'+
        (mo.items.length?'<span class="label num">'+esc(T("paidPct")(p,mo.items.length))+'</span>':'');
      b.onclick=()=>{ const [yy,mm]=k.split("-"); cur=new Date(+yy,+mm-1,1); view="month"; filter="all"; efilter="all"; render(); window.scrollTo(0,0); };
      li.appendChild(b); ul.appendChild(li);
    }
  }

  function loadExample(){
    const k=keyOf(cur), mo=month(k); if(!mo.salary) mo.salary=15000; if(!mo.budget) mo.budget=3000;
    const names=T("exItems"), ex=" "+T("ex");
    mo.items=[[4000,1,"housing"],[1850,5,"loans"],[350,10,"bills"],[300,12,"bills"],[1200,15,"education"],[2000,25,"family"],[250,20,"subs"]]
      .map(([amount,day,cat],i)=>({id:uid(),name:names[i]+ex,amount,day,cat,recurring:true,paid:false,paidAt:null}));
    const [y,m]=k.split("-").map(Number), lim=Math.max(1,Math.min(daysElapsed(k)||lastDay(y,m-1),lastDay(y,m-1)));
    const en=T("exExp"); const d=n=>k+"-"+String(Math.min(n,lim)).padStart(2,"0");
    mo.expenses=[[420,"groceries",0,1],[18,"dining",1,2],[150,"fuel",2,3],[65,"dining",3,3],[38,"health",4,4],[120,"fun",5,5],[22,"dining",1,6]]
      .map(([amount,cat,ni,day])=>({id:uid(),amount,cat,note:en[ni]+ex,date:d(day)}));
    render(); persist();
  }

  /* ================= sheets ================= */
  function buildPickers(){
    const build=(el,set,nameOf,name)=>{ const sel=(el.querySelector("input:checked")||{}).value;
      el.innerHTML=set.map(c=>'<label><input type="radio" name="'+name+'" value="'+c.k+'" id="'+name+'_'+c.k+'"><span class="dot" style="background:'+c.c+'"></span>'+esc(nameOf(c.k))+'</label>').join("");
      if(sel){ const i=document.getElementById(name+"_"+sel); if(i) i.checked=true; } };
    build($("catPick"),OCATS,catName,"ocat"); build($("expPick"),ECATS,ecatName,"ecat");
  }
  let openSheetEl=null;
  function showSheet(el){ $("scrim").hidden=false; el.hidden=false; openSheetEl=el; }
  function closeSheet(){ ["sheet","expSheet","setSheet"].forEach(i=>$(i).hidden=true); $("scrim").hidden=true; openSheetEl=null; editing=null; editingExp=null;
    ["confirmBox","expConfirm","impConfirm"].forEach(i=>$(i).innerHTML=""); $("setMsg").hidden=true; }
  function confirmDel(boxId,onYes){ const box=$(boxId); box.innerHTML=""; const d=document.createElement("div"); d.className="confirm"; d.innerHTML="<span>"+esc(T("confirmDel"))+"</span>";
    const yb=document.createElement("button"); yb.type="button"; yb.className="btn danger"; yb.textContent=T("yesDel"); yb.onclick=onYes; d.appendChild(yb); box.appendChild(d); }

  function setMode(numMode,label){ $("itemBlock").hidden=numMode; $("numField").hidden=!numMode; if(label) $("fNumLabel").textContent=label; $("formErr").hidden=true; $("confirmBox").innerHTML=""; }
  function openItem(id){
    const k=keyOf(cur), it=id?month(k).items.find(x=>x.id===id):null;
    editing=id||"new"; setMode(false);
    $("sheetTitle").textContent=it?T("editOb"):T("newOb");
    $("fName").value=it?it.name:""; $("fAmt").value=it?it.amount:""; $("fDay").value=it?it.day:""; $("fRec").checked=it?!!it.recurring:true;
    $("ocat_"+(it?catOf(it.cat).k:(filter!=="all"?filter:"other"))).checked=true;
    $("delBtn").hidden=!it; showSheet($("sheet")); setTimeout(()=>$(it?"fAmt":"fName").focus(),50);
  }
  function openSalary(){ editing="salary"; setMode(true,T("salaryField")); $("sheetTitle").textContent=T("salaryOf")(monthName(keyOf(cur))); $("fNum").value=month(keyOf(cur)).salary||""; $("delBtn").hidden=true; showSheet($("sheet")); setTimeout(()=>$("fNum").focus(),50); }
  function openBudget(){ editing="budget"; setMode(true,T("budgetField")); $("sheetTitle").textContent=T("budgetT")+" · "+monthName(keyOf(cur)); $("fNum").value=month(keyOf(cur)).budget||""; $("delBtn").hidden=true; showSheet($("sheet")); setTimeout(()=>$("fNum").focus(),50); }
  $("form").addEventListener("submit",e=>{
    e.preventDefault(); const mo=month(keyOf(cur)), err=$("formErr");
    if(editing==="salary") mo.salary=Math.max(0,parseFloat($("fNum").value)||0);
    else if(editing==="budget") mo.budget=Math.max(0,parseFloat($("fNum").value)||0);
    else{
      const name=$("fName").value.trim(), amount=parseFloat($("fAmt").value), day=parseInt($("fDay").value,10);
      if(!name){ err.textContent=T("errName"); err.hidden=false; return $("fName").focus(); }
      if(!(amount>0)){ err.textContent=T("errAmt"); err.hidden=false; return $("fAmt").focus(); }
      if(!(day>=1&&day<=31)){ err.textContent=T("errDay"); err.hidden=false; return $("fDay").focus(); }
      const cat=($("catPick").querySelector("input:checked")||{}).value||"other", rec=$("fRec").checked;
      if(editing==="new") mo.items.push({id:uid(),name,amount,day,cat,recurring:rec,paid:false,paidAt:null});
      else Object.assign(mo.items.find(x=>x.id===editing),{name,amount,day,cat,recurring:rec});
    }
    closeSheet(); render(); persist();
  });
  $("delBtn").onclick=()=>confirmDel("confirmBox",()=>{ const id=editing, mo=month(keyOf(cur)); mo.items=mo.items.filter(x=>x.id!==id); closeSheet(); render(); persist(); });

  function findExp(id){ for(const [k,mo] of Object.entries(state.months)){ const e=mo.expenses.find(x=>x.id===id); if(e) return {k,e}; } return null; }
  function openExp(id){
    const f=id?findExp(id):null; editingExp=id||"new";
    $("expTitle").textContent=f?T("editExp"):T("newExpT"); $("expErr").hidden=true; $("expConfirm").innerHTML="";
    $("eAmt").value=f?f.e.amount:""; $("eNote").value=f?f.e.note:"";
    const k=keyOf(cur), [y,m]=k.split("-").map(Number);
    $("eDate").value=f?f.e.date:(k===keyOf(today)?ymd(today):k+"-"+String(k<keyOf(today)?lastDay(y,m-1):1).padStart(2,"0"));
    $("ecat_"+(f?ecatOf(f.e.cat).k:(efilter!=="all"?efilter:"groceries"))).checked=true;
    $("expDel").hidden=!f; showSheet($("expSheet")); setTimeout(()=>$("eAmt").focus(),50);
  }
  $("expForm").addEventListener("submit",e=>{
    e.preventDefault(); const err=$("expErr");
    const amount=parseFloat($("eAmt").value), date=$("eDate").value;
    if(!(amount>0)){ err.textContent=T("errAmt"); err.hidden=false; return $("eAmt").focus(); }
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){ err.textContent=T("errDate"); err.hidden=false; return; }
    const rec={amount,cat:($("expPick").querySelector("input:checked")||{}).value||"misc",note:$("eNote").value.trim().slice(0,120),date};
    if(editingExp!=="new"){ const f=findExp(editingExp); if(f) state.months[f.k].expenses=state.months[f.k].expenses.filter(x=>x.id!==editingExp); rec.id=editingExp; } else rec.id=uid();
    month(date.slice(0,7)).expenses.push(rec);
    closeSheet(); render(); persist();
  });
  $("expDel").onclick=()=>confirmDel("expConfirm",()=>{ const f=findExp(editingExp); if(f) state.months[f.k].expenses=state.months[f.k].expenses.filter(x=>x.id!==editingExp); closeSheet(); render(); persist(); });

  /* ================= settings ================= */
  function fillSettings(){
    $("whereNote").textContent=mode==="cloud"?T("cloudNote"):T("localNote");
    const ag=$("acctGroup"); ag.hidden=!sbUser;
    $("langGroup").style.borderTop=sbUser?"":"none"; $("langGroup").style.paddingTop=sbUser?"":"0";
    if(sbUser){ const n=usernameOf(sbUser); $("acctName").textContent=n; $("acctAv").textContent=n.slice(0,1).toUpperCase(); }
  }
  function openSettings(){ fillSettings(); showSheet($("setSheet")); }
  function showSetMsg(t,bad){ const m=$("setMsg"); m.textContent=t; m.classList.toggle("neg",!!bad); m.hidden=false; }
  $("chgPass").onclick=async()=>{
    const p=$("newPass").value; if(p.length<6) return showSetMsg(T("errPass"),true);
    try{ const {error}=await sb.auth.updateUser({password:p}); if(error) throw error; $("newPass").value=""; showSetMsg(T("passChanged")); }
    catch(e){ showSetMsg(T(mapErr(e)),true); }
  };
  $("logoutBtn").onclick=async()=>{
    if(saveTimer){ clearTimeout(saveTimer); saveTimer=null; await flush(); }
    try{ await sb.auth.signOut(); }catch(e){}
    try{ localStorage.removeItem(cacheKey); }catch(e){}
    sbUser=null; backend=null; state={v:3,months:{}}; ready=false; setStatus("");
    closeSheet(); view="month"; sub="obl"; $("aUser").value=""; $("aPass").value=""; showAuth();
  };
  async function saveFile(filename,text,mime){
    let dl=null; try{ dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null; }catch(e){}
    if(dl){ try{ await dl.save({filename,data:text}); showSetMsg(T("saved")(filename)); }catch(e){ if(e&&e.code!=="declined") showSetMsg(T("dlFail"),true); } return; }
    try{ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([text],{type:mime})); a.download=filename; document.body.appendChild(a); a.click();
      setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000); showSetMsg(T("saved")(filename)); }catch(e){ showSetMsg(T("dlFail"),true); }
  }
  const stamp=()=>ymd(new Date());
  $("expJson").onclick=()=>saveFile("masarifi-backup-"+stamp()+".json",JSON.stringify({app:"masarifi",exported:new Date().toISOString(),...state},null,2),"application/json");
  $("expCsv").onclick=()=>{
    const q=v=>{ v=String(v??""); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
    const lines=[["month","type","date","name","category","amount","due_day","recurring","paid","paid_on","salary","daily_budget"].join(",")];
    for(const k of Object.keys(state.months).sort()){ const mo=state.months[k];
      for(const i of mo.items) lines.push([k,"obligation","",i.name,catName(i.cat),i.amount,i.day,i.recurring?"yes":"no",i.paid?"yes":"no",i.paidAt||"",mo.salary,mo.budget].map(q).join(","));
      for(const e of [...mo.expenses].sort((a,b)=>a.date.localeCompare(b.date))) lines.push([k,"daily",e.date,e.note,ecatName(e.cat),e.amount,"","","","",mo.salary,mo.budget].map(q).join(","));
      if(!mo.items.length&&!mo.expenses.length&&mo.salary) lines.push([k,"salary","","","","","","","","",mo.salary,mo.budget].map(q).join(","));
    }
    saveFile("masarifi-history-"+stamp()+".csv","﻿"+lines.join("\n"),"text/csv");
  };
  $("impFile").addEventListener("change",e=>{
    const f=e.target.files&&e.target.files[0]; e.target.value=""; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{ let parsed=null; try{ parsed=normalize(JSON.parse(r.result)); }catch(err){}
      const n=parsed?Object.keys(parsed.months).length:0, box=$("impConfirm"); box.innerHTML="";
      if(!n) return showSetMsg(T("badFile"),true);
      const d=document.createElement("div"); d.className="confirm"; d.innerHTML="<span>"+esc(T("impAsk")(n))+"</span>";
      const yb=document.createElement("button"); yb.type="button"; yb.className="btn danger"; yb.textContent=T("restore");
      yb.onclick=()=>{ state=parsed; box.innerHTML=""; persist(); if(backend) flush(); render(); showSetMsg(T("restored")(n)); };
      d.appendChild(yb); box.appendChild(d); };
    r.readAsText(f);
  });
  document.querySelectorAll("#segLang button").forEach(b=>b.onclick=()=>setLang(b.dataset.v));
  document.querySelectorAll("#segTheme button").forEach(b=>b.onclick=()=>{ theme=b.dataset.v; setPref("iltizamat_theme",theme); applyTheme(); });

  /* ================= wiring ================= */
  document.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeSheet);
  $("scrim").onclick=closeSheet;
  document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&openSheetEl) closeSheet(); });
  $("addBtn").onclick=()=>sub==="exp"?openExp(null):openItem(null);
  $("salaryBtn").onclick=openSalary; $("setBtn").onclick=openSettings;
  $("langBtn").onclick=()=>setLang(lang==="ar"?"en":"ar"); $("authLang").onclick=()=>setLang(lang==="ar"?"en":"ar");
  $("themeBtn").onclick=()=>{ theme=isDark()?"light":"dark"; setPref("iltizamat_theme",theme); applyTheme(); };
  $("tabMonth").onclick=()=>{ view="month"; render(); }; $("tabAna").onclick=()=>{ view="ana"; render(); }; $("tabHist").onclick=()=>{ view="hist"; render(); };
  document.querySelectorAll("#subSeg button").forEach(b=>b.onclick=()=>{ sub=b.dataset.v; render(); });
  const shift=d=>{ cur=new Date(cur.getFullYear(),cur.getMonth()+d,1); filter="all"; efilter="all"; render(); };
  $("prevM").onclick=()=>shift(-1); $("nextM").onclick=()=>shift(1); $("aPrev").onclick=()=>shift(-1); $("aNext").onclick=()=>shift(1);

  /* ================= boot ================= */
  applyTheme(); applyLang();
  (async function boot(){
    await null;
    if(CFG&&CFG.supabaseUrl&&CFG.supabaseAnonKey&&!/YOUR_/.test(CFG.supabaseUrl+CFG.supabaseAnonKey)&&window.supabase){ try{ await startSupabase(); }catch(e){ startLocal(); } }
    else if(window.claude&&window.claude.use) await startClaude();
    else startLocal();
  })();
})();
</script>
<script>
if("serviceWorker" in navigator){ window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
</script>
</body>
</html>
